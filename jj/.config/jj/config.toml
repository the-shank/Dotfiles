#:schema https://docs.jj-vcs.dev/latest/config-schema.json

[user]
name = "Shank"
email = "shashanksharma21@gmail.com"

[ui]
merge-editor = "nvim"

[merge-tools.nvim]
program = "nvim"
merge-args = ["-d", "$left", "$base", "$right", "$output"]
merge-tool-edits-conflict-markers = false

[snapshot]
max-new-file-size = "200MiB"

[template-aliases]
'format_timestamp(timestamp)' = 'timestamp.ago()'
'format_short_id(id)' = 'id.shortest(4)'

'builtin_log_comfortable' = '''
label(
  if(current_working_copy, "working_copy"),
  concat(
    separate(" ",
      format_short_change_id_with_change_offset(self),
      bookmarks,
      tags,
      working_copies,
      if(conflict, label("conflict", "×")),
      if(empty, label("empty", "(empty)")),
      if(description,
        description.first_line(),
        label(if(empty, "empty"), description_placeholder),
      ),
      format_timestamp(commit_timestamp(self)),
      if(immutable, label("immutable", "🔒")),
    ),
    "\n",
  ),
)
'''

[aliases]
pull = ["util", "exec", "--", "bash", "-c", "jj git fetch && jj rebase -d 'trunk()'"]
lg = ["log", "-T", "builtin_log_comfortable"]
lgg = [
  "log",
  "-r",
  "(builtin_log() | ::@) & committer_date(after:'10 days ago')",
  "-T",
  "builtin_log_comfortable",
]
lga = ["log", "-r", "builtin_log() | ::@", "-T", "builtin_log_comfortable"]
extract = ["split", "--insert-before", "@"]
restow = [
  "util",
  "exec",
  "--",
  "bash",
  "-c",
  """
  test "$(basename "$(jj root 2>/dev/null)")" = dotfiles || { echo "jj restow only works inside dotfiles" >&2; exit 1; }
  cd "$(jj root)"
  jj diff -r "committer_date(after:'${1:-30} days ago') & ~@" --name-only | cut -d/ -f1 | sort -u | while read -r p; do
    [ -d "$p" ] && [ "$p" != ".git" ] && [ "$p" != ".jj" ] && [ "$p" != "tmp" ] && stow --no-folding -R "$p"
  done
  """,
  "bash",
]

